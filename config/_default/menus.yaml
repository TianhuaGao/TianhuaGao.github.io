# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: /
    weight: 10
  - name: News
    url: /#news
    weight: 11
  - name: Papers
    url: /#papers
    weight: 12
  - name: Events
    url: /#events
    weight: 13
  - name: Code
    url: code/
    weight: 20
  - name: Guides
    url: guides/
    weight: 40
  - name: Documentation
    url: documentation/
    weight: 50
