    description: Decodes local/global MAVLink position targets, validates the coordinate frame, and routes supported commands into Guided setters.
    excerpt: |-
      void GCS_MAVLINK_Copter::handle_message_set_position_target_local_ned(
          const mavlink_message_t &msg)
      {
          mavlink_set_position_target_local_ned_t packet;
          mavlink_msg_set_position_target_local_ned_decode(&msg, &packet);
          if (!copter.flightmode->in_guided_mode()) {
              return;
          }
      }

