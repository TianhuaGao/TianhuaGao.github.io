  - id: hal
    index: "21"
    label: HAL per-motor output
    group: safety
    bbox: [1360, 635, 160, 50]
    rx: 8
    file: libraries/AP_Motors/AP_Motors_Class.cpp
    line_start: 96
    line_end: 105
    symbol: AP_Motors::rc_write
    description: Writes final per-motor PWM values to the standard SRV output channels after frame mixing and spool handling.
    excerpt: |-
      void AP_Motors::rc_write(uint8_t chan, uint16_t pwm)
      {
      SRV_Channel::Function function = SRV_Channels::get_motor_function(chan);
      if ((1U<<chan) & _motor_pwm_scaled.mask) {
          SRV_Channels::set_output_scaled(function, float(pwm) - _motor_pwm_scaled.offset);
      } else {
          SRV_Channels::set_output_pwm(function, pwm);
      }
      }

