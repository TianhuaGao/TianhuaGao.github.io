flows:
  - id: guided
    index: "02"
    kicker: Guided lifecycle
    title: Follow Guided from entry to motor ownership
    description: The paper's final Guided lifecycle figure becomes a source-linked walkthrough. Focus a stage, then select a highlighted step to inspect its primary PID-only implementation boundary.
    diagram_title: Interactive Guided full-geometric lifecycle
    image: images/ardugeo-guided-lifecycle.svg
    width: 1400
    height: 1500
    source_title: Guided, one lifecycle at a time
    source_description: Current-state entry, bounded target generation, frame-exclusive output, fallback, and same-mode landing are traced to the current PID-only snapshot.
    groups:
      - id: all
        index: "00"
        label: Overview
        viewbox: [0, 0, 1400, 1500]
      - id: entry
        index: "01"
        label: Entry + eligibility
        viewbox: [430, 80, 540, 385]
      - id: reference
        index: "02"
        label: Guided references
        viewbox: [20, 460, 1360, 360]
      - id: control
        index: "03"
        label: Control + ownership
        viewbox: [350, 815, 700, 410]
      - id: lifecycle
        index: "04"
        label: Lifecycle + fallback
        viewbox: [20, 1220, 900, 270]
    nodes:
      - id: entry
        index: "01"
        label: Enter Guided + request eligibility
        group: entry
        bbox: [550, 112, 300, 154]
        rx: 18
        file: ArduCopter/mode_guided.cpp
        line_start: 55
        line_end: 125
        symbol: ModeGuided::init
        description: Clears inherited external-reference ownership, resets lifecycle state, and selects a current-state PVA entry when full-geometric options are requested.
        excerpt: |-
          const bool full_geometric_entry =
              geometric_motor_output_options_requested();
          if (full_geometric_entry) {
              posvelaccel_control_start();
          } else {
              velaccel_control_start();
          }

      - id: prewarm
        index: "02"
        label: Ground-safe prewarm + arm readiness
        group: entry
        bbox: [535, 282, 330, 161]
        rx: 18
        file: ArduCopter/mode_guided.cpp
        line_start: 2237
        line_end: 2268
        symbol: ModeGuided::update_geometric_ground_safe_observer
        description: Builds a measured-state, gravity-compensated NED target with zero collective and keeps it fresh until arming and spool readiness pass.
        excerpt: |-
          geometric_target.velocity_ned_ms =
              pos_control->get_vel_estimate_NED_ms();
          geometric_target.accel_ned_mss =
              Vector3f{0.0f, 0.0f, GRAVITY_MSS};
          ahrs.get_quat_body_to_ned(
              geometric_target.attitude_body_to_ned);

      - id: dispatch
        index: "03"
        label: Supported Guided target dispatch
        group: reference
        bbox: [545, 495, 310, 84]
        rx: 14
        file: ArduCopter/mode_guided.cpp
        line_start: 272
        line_end: 297
        symbol: ModeGuided::geometric_submode_supported
        description: Admits supported non-terrain TakeOff and Pos, PosVelAccel, internal Land, and pause semantics; incompatible targets remain native.
        excerpt: |-
          case SubMode::TakeOff:
              return !guided_geometric_takeoff_terrain_alt;
          case SubMode::Pos:
              return !guided_is_terrain_alt;
          case SubMode::PosVelAccel:
          case SubMode::Land:
              return true;

      - id: takeoff
        index: "04"
        label: Geometric takeoff
        group: reference
        bbox: [140, 605, 280, 82]
        rx: 12
        file: ArduCopter/mode_guided.cpp
        line_start: 1246
        line_end: 1323
        symbol: ModeGuided::takeoff_run
        description: Leaves arm, interlock, and spool authority with AP_Motors, keeps the ground-safe target fresh, then starts the shaped altitude reference.
        excerpt: |-
          if (!motors->armed() || !copter.ap.auto_armed ||
              motors->get_spool_state() !=
                  AP_Motors::SpoolState::THROTTLE_UNLIMITED) {
              guided_geometric_takeoff_spool_ready = false;
              update_geometric_ground_safe_observer();
              return;
          }

      - id: position
        index: "05"
        label: Position / PVA / pause
        group: reference
        bbox: [560, 605, 280, 82]
        rx: 12
        file: ArduCopter/mode_guided.cpp
        line_start: 1130
        line_end: 1176
        symbol: ModeGuided::set_pos_vel_accel_NED_m
        description: Merges Guided position, velocity, acceleration, and yaw semantics, then prepares the compatible target before the next rate frame.
        excerpt: |-
          guided_pos_target_ned_m =
              guided_geometric_target_manager.set_position_target(
                  pos_ned_m, false,
                  geometric_position_control_active() ?
                      &current_pos_ned_m : nullptr);
          guided_vel_target_ned_ms = vel_ned_ms;
          guided_accel_target_ned_mss = accel_ned_mss;

      - id: land
        index: "06"
        label: Internal geometric Land
        group: reference
        bbox: [980, 605, 280, 82]
        rx: 12
        file: ArduCopter/mode_guided.cpp
        line_start: 1344
        line_end: 1443
        symbol: ModeGuided::geometric_land_run
        description: Holds horizontal position and yaw, ramps NED descent velocity, and anchors vertical position to the estimate until the land detector fires.
        excerpt: |-
          Vector3p landing_target_ned_m =
              guided_geometric_land_hold_ned_m;
          landing_target_ned_m.z = current_pos_ned_m.z;
          target_velocity_ned_ms.z =
              guided_geometric_land_descent_ned_ms;
          update_geometric_position_observer(
              &landing_target_ned_m, target_velocity_ned_ms,
              target_accel_ned_mss, heading, false, false);

      - id: reference
        index: "07"
