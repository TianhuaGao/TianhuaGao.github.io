        bbox: [505, 715, 390, 72]
        rx: 12
        file: libraries/AC_GeometricControl/AC_GeometricControl.cpp
        line_start: 517
        line_end: 565
        symbol: AC_GeometricControl::update
        description: Converts step-like Guided commands into one bounded position, velocity, acceleration, yaw, and yaw-rate trajectory before feedback.
        excerpt: |-
          if (_shape_enabled &&
              target.build_attitude_from_position &&
              target.shape_position_target) {
              _setpoint_shaper.set_limits(limits);
              _setpoint_shaper.update(
                  state, target, dt, position_target);
              _shaper_active = true;
          }

