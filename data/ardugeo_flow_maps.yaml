        group: control
        bbox: [500, 1120, 400, 70]
        rx: 12
        file: ArduCopter/Attitude.cpp
        line_start: 25
        line_end: 92
        symbol: Copter::run_rate_controller_main
        description: Selects exactly one writer per main-rate frame; an authorized geometric frame freezes native rate PID and writes normalized intent through AP_Motors.
        excerpt: |-
          if (geometric_output_active) {
              attitude_control->rate_controller_update_throttle_mix();
              geometric_motor_output_to_motors();
              geometric_motor_output_frame_count++;
              geometric_motor_output_was_active = true;
          } else {
              attitude_control->rate_controller_run();
              native_rate_controller_frame_count++;
          }

      - id: handoff
        index: "12"
        label: Atomic handoff + native Guided
