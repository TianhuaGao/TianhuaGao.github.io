        excerpt: |-
          if (copter.ap.land_complete) {
              motors->set_desired_spool_state(
                  AP_Motors::DesiredSpoolState::GROUND_IDLE);
              update_geometric_ground_safe_observer();

              if (motors->get_spool_state() ==
                  AP_Motors::SpoolState::GROUND_IDLE) {

      - id: ground-idle
        index: "14"
        label: Ground-safe through idle
        group: lifecycle
        bbox: [520, 1360, 360, 62]
        rx: 30
        file: ArduCopter/mode_guided.cpp
        line_start: 1370
        line_end: 1407
        symbol: ModeGuided::geometric_land_run
        description: Waits for GROUND_IDLE, disarms explicitly, and recreates the zero-collective hold so another Guided lifecycle can start without leaving the mode.
        excerpt: |-
          if (motors->get_spool_state() ==
              AP_Motors::SpoolState::GROUND_IDLE) {
              // …
              if (copter.arming.disarm(
                      AP_Arming::Method::LANDED)) {
                  posvelaccel_control_start();
                  update_geometric_ground_safe_observer();
              }
          }

