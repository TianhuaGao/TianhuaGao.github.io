        bbox: [70, 1255, 330, 162]
        rx: 32
        file: ArduCopter/Attitude.cpp
        line_start: 38
        line_end: 92
        symbol: Copter::run_rate_controller_main
        description: On an ownership falling edge, transfers controller state before native PID runs in the same frame; a no-request entry can stay native directly.
        excerpt: |-
          if (geometric_motor_output_was_active &&
              !geometric_output_active) {
              if (flightmode != nullptr) {
                  flightmode->
                      handle_geometric_motor_output_fallback();
              }
              geometric_motor_output_was_active = false;
          }

